name: MMA Scraper

on:
  schedule:
    # Sherdog (incl. UFC) — Saturday fight night (2pm–10pm PST = 22:00 Sat – 06:00 Sun UTC)
    - cron: '*/10 22-23 * * 6'   # Sat 2pm–4pm PST, every 10 min
    - cron: '*/10 0-5 * * 0'     # Sat 4pm–10pm PST, every 10 min
    # Full daily run at 11:30pm PST
    - cron: '30 7 * * *'
  workflow_dispatch:               # manual trigger from GitHub UI

concurrency:
  group: scraper
  cancel-in-progress: false        # let running jobs finish

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create .env from secrets
        run: |
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" >> .env
          echo "SUPABASE_KEY=${{ secrets.SUPABASE_KEY }}" >> .env
          echo "YOUTUBE_API_KEY=${{ secrets.YOUTUBE_API_KEY }}" >> .env
          echo "GMAIL_ADDRESS=${{ secrets.GMAIL_ADDRESS }}" >> .env
          echo "GMAIL_APP_PASSWORD=${{ secrets.GMAIL_APP_PASSWORD }}" >> .env

      # ufcstats (start.py) retired — Sherdog is now the source of truth for
      # every org including UFC. Runs on every schedule so live UFC fight-night
      # results are captured, not just the daily pass.
      - name: Run Sherdog scraper (all orgs incl. UFC)
        run: python sherdog_scraper.py

      - name: Resolve fighter genders via Wikidata (daily only)
        if: github.event.schedule == '30 7 * * *' || github.event_name == 'workflow_dispatch'
        run: python gender_scraper.py

      # Confirm gender by opponent unanimity (cheap, no API) and auto-resolve the
      # gender review items. Runs after gender_scraper so it uses its fresh checks.
      - name: Propagate gender from opponents (daily only)
        if: github.event.schedule == '30 7 * * *' || github.event_name == 'workflow_dispatch'
        run: python gender_propagate.py --apply

      - name: Email review queue digest (daily only)
        if: github.event.schedule == '30 7 * * *' || github.event_name == 'workflow_dispatch'
        run: python review_email.py

      - name: Run ESPN PFL video scraper (daily only)
        if: github.event.schedule == '30 7 * * *' || github.event_name == 'workflow_dispatch'
        run: python espn_pfl_scraper.py --push

      - name: Run YouTube video scraper (daily only)
        if: github.event.schedule == '30 7 * * *' || github.event_name == 'workflow_dispatch'
        run: python youtube_scraper.py --push

      # Flag amateur bouts on pro-named cards (Sherdog only marks amateur on the
      # fighter page). Incremental via amateur_checked.txt — only fighters added
      # since the last run are checked. Scoped to orgs that run amateur cards;
      # --limit caps a one-off backlog (resumes next night). Add new amateur-
      # running orgs to this list when they're added to SHERDOG_ORGS.
      - name: Flag amateur fights from fighter pages (daily only)
        if: github.event.schedule == '30 7 * * *' || github.event_name == 'workflow_dispatch'
        run: python amateur_scraper.py --orgs "Fury FC,King of the Cage,LFA,CFFC,Shooto,Pancrase,Invicta FC,Cage Warriors,EliteXC,Titan FC,UAE Warriors,Eternal MMA,Ares FC,A1 Combat,UWC,LUX,JCK,APFC,XFN,Legacy FC,CES MMA,iKON FC,Shooto Brazil,BFL,Tuff-N-Uff,Unified MMA,INKA MMA,Bison Kombat,ZFN,FAC,WXC,Alaska FC,Combat FC,FCC,Shuriken Fight Series,Fight Club Rush" --limit 2000

      # Fighter photo + bio for the app's fighter page. Only new fighters have a
      # null profile_scraped_at, so a nightly run is a handful of pages; --limit
      # caps it in case a big backlog appears (resumes the next night).
      - name: Scrape fighter profiles from fighter pages (daily only)
        if: github.event.schedule == '30 7 * * *' || github.event_name == 'workflow_dispatch'
        run: python fighter_profile_scraper.py --limit 2000

      # Divisional + P4P rankings from ufc.com and Sherdog's rankings articles
      # -> rankings table for the app's Rankings page, stored as dated
      # snapshots whenever a source's lists change. Then tags upcoming UFC
      # fights with each fighter's current rank (frozen once
      # the fight is in the past). UFC updates Tuesdays, Sherdog after big
      # cards; daily is plenty. No tracker file. Runs after the Sherdog pass so
      # newly booked fights get tagged the same night.
      - name: Scrape rankings from ufc.com + Sherdog (daily only)
        if: github.event.schedule == '30 7 * * *' || github.event_name == 'workflow_dispatch'
        run: python rankings_scraper.py

      # Community fight/event scores from Verdict MMA -> fight_crowd_ratings /
      # event_crowd_ratings ("other users" in the app's blended score). Reads
      # the ten most recent cards plus every stored event from the last 30
      # days (ratings keep arriving for weeks). No tracker file — state is the
      # DB. Unmatched bouts -> verdict_unmatched.txt (not committed).
      - name: Scrape crowd ratings from Verdict MMA (daily only)
        if: github.event.schedule == '30 7 * * *' || github.event_name == 'workflow_dispatch'
        run: python verdict_scraper.py

      # UFC post-fight bonus awards (FOTN / POTN) from the Wikipedia event
      # pages -> fight_bonuses. Nightly it only checks UFC events from the
      # last 45 days that have no bonus rows yet, so it's a few pages a night.
      - name: Scrape UFC bonus awards from Wikipedia (daily only)
        if: github.event.schedule == '30 7 * * *' || github.event_name == 'workflow_dispatch'
        run: python bonus_scraper.py

      # Rebuild the app's precomputed views (event_flags_mv for the events
      # list, community_fight_base for the community dashboard) so whatever
      # this pass wrote is what the app shows. Every trigger, and even after
      # an earlier step failed — anything that did land should still surface.
      - name: Refresh app caches
        if: always()
        run: python refresh_app_caches.py

      - name: Save completed events trackers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sherdog_completed_events.txt amateur_checked.txt
          git diff --staged --quiet && echo "No tracker changes to commit." && exit 0
          git commit -m "Update completed events trackers [skip ci]"
          # The job can run for hours; main may have moved on the remote in the
          # meantime. Rebase onto the latest remote and retry so a concurrent
          # push doesn't fail the whole run.
          for attempt in 1 2 3 4 5; do
            if git pull --rebase --autostash origin main && git push; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "Push attempt $attempt failed; refetching and retrying..."
            sleep 5
          done
          echo "::error::Could not push tracker updates after 5 attempts."
          exit 1
