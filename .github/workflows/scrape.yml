name: UFC Scraper

on:
  schedule:
    # start.py — Saturday fight night (6pm–midnight ET = 22:00–03:59 UTC)
    - cron: '*/10 22-23 * * 6'   # Sat 6pm–8pm ET, every 10 min
    - cron: '*/10 0-3 * * 0'     # Sat 8pm–midnight ET, every 10 min
    # start.py + paramount — daily (10am ET)
    - cron: '0 14 * * *'
  workflow_dispatch:               # manual trigger from GitHub UI

concurrency:
  group: scraper
  cancel-in-progress: false        # let running jobs finish

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create .env from secrets
        run: |
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" >> .env
          echo "SUPABASE_KEY=${{ secrets.SUPABASE_KEY }}" >> .env

      - name: Run UFC stats scraper
        run: python start.py

      - name: Save completed events tracker
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add completed_events.txt
          git diff --staged --quiet || git commit -m "Update completed events tracker [skip ci]"
          git push
