name: MMA Scraper

on:
  schedule:
    # start.py — Saturday fight night (2pm–10pm PST = 22:00 Sat – 06:00 Sun UTC)
    - cron: '*/10 22-23 * * 6'   # Sat 2pm–4pm PST, every 10 min
    - cron: '*/10 0-5 * * 0'     # Sat 4pm–10pm PST, every 10 min
    # start.py — daily at 11:30pm PST
    - cron: '30 7 * * *'
  workflow_dispatch:               # manual trigger from GitHub UI

concurrency:
  group: scraper
  cancel-in-progress: false        # let running jobs finish

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create .env from secrets
        run: |
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" >> .env
          echo "SUPABASE_KEY=${{ secrets.SUPABASE_KEY }}" >> .env

      - name: Run UFC stats scraper
        run: python start.py

      - name: Run PFL scraper (daily only)
        if: github.event.schedule == '30 7 * * *' || github.event_name == 'workflow_dispatch'
        run: python pfl_scraper.py

      - name: Save completed events trackers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add completed_events.txt pfl_completed_events.txt
          git diff --staged --quiet || git commit -m "Update completed events trackers [skip ci]"
          git push
